<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR của Phòng Khởi nghiệp và Đổi mới Sáng tạo</title>
<meta name="description" content="Công cụ tạo, rút gọn link mã QR của Phòng Khởi nghiệp và Đổi mới Sáng tạo">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2e6b2e">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1da;--acc:#2f5bea;--accink:#fff;--field:#faf9f6}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e22;--ink:#f1f1f3;--mute:#9a9aa3;--line:#2f2f35;--acc:#6f8cff;--accink:#0d0d12;--field:#18181b}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 48px}
.brand{display:flex;gap:14px;align-items:center;margin:0 0 6px}
.brand img{height:56px;width:auto;flex:none}
@media (prefers-color-scheme:dark){.brand img{background:#fff;border-radius:10px;padding:4px 8px}}
@media (max-width:560px){.brand{flex-direction:column;align-items:flex-start}}
h1{font-size:24px;line-height:1.25;margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line);border-radius:11px;background:var(--field);margin-top:12px}
.seg button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 8px;background:transparent;color:var(--ink);text-align:center}
.seg button small{display:block;font-size:12px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--accink);font-weight:600}
.seg button[aria-pressed=true] small{color:inherit;opacity:.85}
.info{font-size:13px;margin:10px 0 0;padding:8px 10px;border-radius:9px;background:var(--field);border:1px solid var(--line);word-break:break-all;overflow-wrap:anywhere;max-height:120px;overflow-y:auto}
.info b{display:block;color:var(--acc)}
.sm.logoPick{margin-top:8px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}.pv{order:-1;position:static!important}}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card+.card{margin-top:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:0 0 12px;font-weight:600}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input[type=text],input[type=url],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink);font:inherit}
textarea{min-height:84px;max-height:200px;resize:vertical;overflow:auto;overflow-wrap:anywhere;word-break:break-all;white-space:pre-wrap}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
.chip,.btn,.sm{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:9px;padding:7px 12px}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;font-size:13px}
input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--acc)}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0 0;color:var(--ink);font-size:14px}
.pv{position:sticky;top:16px}
.stage{display:grid;place-items:center;padding:20px;border-radius:10px;background:#e4e2db;border:1px solid var(--line);min-height:280px}
@media (prefers-color-scheme:dark){.stage{background:#0c0c0e}}
.stage.tp{background:repeating-conic-gradient(#c9c7c0 0 25%,#f1f0ec 0 50%) 0 0/16px 16px}
@media (prefers-color-scheme:dark){.stage.tp{background:repeating-conic-gradient(#2a2a2f 0 25%,#3c3c43 0 50%) 0 0/16px 16px}}
#qr canvas,#qr svg{max-width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.22)}
.btn{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600;width:100%;margin-top:8px}
.btn.alt{background:var(--field);color:var(--ink);border-color:var(--line)}
.msg{font-size:13px;color:var(--mute);margin:8px 0 0;min-height:20px;word-break:break-all;overflow-wrap:anywhere;max-height:90px;overflow-y:auto}
.hide{display:none}
.short{margin-top:10px;font-size:14px;word-break:break-all}
.list{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.list li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.list .k{font-weight:600;min-width:70px}
.list .u{flex:1;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm{padding:3px 8px;font-size:12px}
.tag{font-size:11px;color:var(--accink);background:var(--acc);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><img src="logo.png" alt="Logo VNU Entrepreneurship &amp; Innovation" height="56"><h1>QR của Phòng Khởi nghiệp và Đổi mới Sáng tạo</h1></div>
<p class="sub">Nhập link, chọn giữ nguyên hoặc rút gọn rồi tải mã QR về.</p>
<div class="grid">
<div>
<div class="card">
<h2>Nội dung mã QR</h2>
<label for="txt" id="txtLb">Dán link hoặc nhập văn bản</label>
<textarea id="txt">https://vnu.edu.vn</textarea>
<div class="seg" role="group" aria-label="Kiểu link trong mã QR">
<button type="button" id="mFull" aria-pressed="true">Link gốc<small>QR chứa đúng link đã nhập</small></button>
<button type="button" id="mShort" aria-pressed="false">Link rút gọn<small>QR chứa link ngắn, lưu tự động</small></button>
</div>
<div id="shortBox" class="hide">
<label for="lk">Mã ngắn (không bắt buộc, để trống sẽ tự tạo)</label>
<input type="text" id="lk" placeholder="VD: hoithao (3–30 ký tự)" maxlength="30">
<button class="btn" id="mk">Tạo link rút gọn</button>
<p class="msg" id="lm"></p>
</div>
</div>

<div class="card">
<h2>Hình dạng</h2>
<label>Kiểu ô điểm</label>
<div class="chips" id="dotType"></div>
<label>Kiểu khung góc</label>
<div class="chips" id="cornerSq"></div>
<label>Kiểu chấm góc</label>
<div class="chips" id="cornerDot"></div>
</div>

<div class="card">
<h2>Màu sắc</h2>
<div class="row">
<div><label for="c1">Màu mã</label><input type="color" id="c1" value="#1f3a8a"></div>
<div><label for="c2">Màu thứ hai</label><input type="color" id="c2" value="#7c3aed"></div>
<div><label for="cbg">Màu nền</label><input type="color" id="cbg" value="#ffffff"></div>
<div><label for="cc">Màu gốc</label><input type="color" id="cc" value="#0f172a"></div>
</div>
<label class="chk"><input type="checkbox" id="grad"> Dùng chuyển sắc cho mã</label>
<label class="chk"><input type="checkbox" id="ccOn"> Dùng màu riêng cho 3 góc</label>
<label class="chk"><input type="checkbox" id="transp"> Nền trong suốt</label>
<label>Bộ màu có sẵn</label>
<div class="sw" id="swatches"></div>
</div>

<div class="card">
<h2>nâng cao</h2>
<label for="logo">Chèn logo vào giữa (PNG, JPG, SVG)</label>
<input type="file" id="logo" accept="image/*">
<div id="logoCtl" class="hide">
<label for="lsz">Kích thước logo: <span id="lszv">30</span>%</label>
<input type="range" id="lsz" min="10" max="45" value="30">
<button class="sm" id="logoRm" style="margin-top:8px">Xoá logo</button>
</div>
<label for="ecl">Mức sửa lỗi (nên chọn cao khi có logo)</label>
<select id="ecl"><option value="L">Thấp (L)</option><option value="M">Trung bình (M)</option><option value="Q">Khá (Q)</option><option value="H" selected>Cao (H)</option></select>
<label for="size">Kích thước ảnh xuất: <span id="sizev">600</span> px</label>
<input type="range" id="size" min="256" max="1200" step="16" value="600">
<label for="mar">Viền quanh mã: <span id="marv">12</span> px</label>
<input type="range" id="mar" min="0" max="48" value="12">
</div>
</div>

<div class="pv">
<div class="card">
<h2>Xem trước</h2>
<div class="stage"><div id="qr"></div></div>
<p class="info" id="info"></p>
<p class="msg" id="msg"></p>
<button class="btn" id="dlPng">Tải PNG</button>
<div class="row"><button class="btn alt" id="dlSvg">Tải SVG</button><button class="btn alt" id="dlWebp">Tải WebP</button></div>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var S={dot:"rounded",sq:"extra-rounded",cd:"dot",logo:null,qr:null,mode:"full",key:null};
var links={};
var SITE="https://vnucsk.github.io/QR/";
var base=/^https?:$/.test(location.protocol)?location.href.replace(/[?#].*$/,"").replace(/[^\/]*$/,""):SITE;
var API="https://qr.vnucsk.workers.dev";
function shortUrl(k){return API+"/"+encodeURIComponent(k)}
function qrData(){
 var t=$("txt").value.trim();
 if(S.mode==="full")return $("txt").value;
 return(S.key&&links[S.key]&&links[S.key]===t)?shortUrl(S.key):"";
}
function syncKey(){
 if(S.mode!=="short")return;
 var t=$("txt").value.trim();
 if(S.key&&links[S.key]===t)return;
 S.key=Object.keys(links).filter(function(x){return links[x]===t})[0]||null;
}
var OPT={
 dotType:[["square","Vuông"],["rounded","Bo tròn"],["dots","Chấm tròn"],["extra-rounded","Siêu tròn"],["classy","Cổ điển"],["classy-rounded","Cổ điển tròn"]],
 cornerSq:[["square","Vuông"],["extra-rounded","Bo tròn"],["dot","Tròn"]],
 cornerDot:[["square","Vuông"],["dot","Tròn"]]
};
var SW=[["#000000","#000000"],["#1f3a8a","#7c3aed"],["#0f766e","#22c55e"],["#be123c","#f97316"],["#111827","#6b7280"],["#7c2d12","#f59e0b"],["#0369a1","#06b6d4"],["#86198f","#ec4899"]];

function chips(id,list,key){
 var box=$(id);
 list.forEach(function(o){
  var b=document.createElement("button");b.className="chip";b.textContent=o[1];b.dataset.v=o[0];
  b.setAttribute("aria-pressed",S[key]===o[0]);
  b.onclick=function(){S[key]=o[0];[].forEach.call(box.children,function(x){x.setAttribute("aria-pressed",x.dataset.v===o[0])});draw()};
  box.appendChild(b);
 });
}
chips("dotType",OPT.dotType,"dot");chips("cornerSq",OPT.cornerSq,"sq");chips("cornerDot",OPT.cornerDot,"cd");
SW.forEach(function(p){
 var b=document.createElement("button");b.style.background="linear-gradient(135deg,"+p[0]+","+p[1]+")";b.title=p[0]===p[1]?"Đen":p[0]+" → "+p[1];
 b.onclick=function(){$("c1").value=p[0];$("c2").value=p[1];$("cc").value=p[0];$("grad").checked=p[0]!==p[1];draw()};
 $("swatches").appendChild(b);
});

function build(){
 var size=+$("size").value,c1=$("c1").value;
 var o={
  width:size,height:size,type:"canvas",data:qrData()||" ",margin:+$("mar").value,
  qrOptions:{errorCorrectionLevel:$("ecl").value},
  dotsOptions:{type:S.dot,color:c1},
  cornersSquareOptions:{type:S.sq,color:$("ccOn").checked?$("cc").value:c1},
  cornersDotOptions:{type:S.cd,color:$("ccOn").checked?$("cc").value:c1},
  backgroundOptions:{color:$("transp").checked?"rgba(0,0,0,0)":$("cbg").value}
 };
 if($("grad").checked)o.dotsOptions.gradient={type:"linear",rotation:Math.PI/4,colorStops:[{offset:0,color:c1},{offset:1,color:$("c2").value}]};
 if(S.logo){o.image=S.logo;o.imageOptions={crossOrigin:"anonymous",margin:6,imageSize:+$("lsz").value/100,hideBackgroundDots:true}}
 return o;
}
var timer=null;
function updateInfo(){
 var d=qrData(),i=$("info");
 if(!d){i.classList.add("hide");return}
 i.classList.remove("hide");
 i.innerHTML=S.mode==="short"
  ?'<b>Mã QR đang chứa LINK RÚT GỌN</b>'+esc(d)+'<br>→ Mở ra: '+esc($("txt").value.trim())
  :'<b>Mã QR đang chứa LINK GỐC</b>'+esc(d);
}
function draw(){
 clearTimeout(timer);
 $("qr").parentNode.classList.toggle("tp",$("transp").checked);
 timer=setTimeout(function(){
  updateInfo();
  var box=$("qr"),d=qrData();
  if(!d){
   box.innerHTML="";S.qr=null;
   $("msg").textContent=S.mode==="short"?"Bấm “Tạo link rút gọn” để tạo mã QR.":"Hãy nhập nội dung để tạo mã QR.";
   return;
  }
  try{
   S.qr=new QRCodeStyling(build());
   box.innerHTML="";S.qr.append(box);
   $("msg").textContent="";
  }catch(e){$("msg").textContent="Nội dung quá dài hoặc không hợp lệ, hãy rút gọn lại."}
 },120);
}
function setMode(m){
 S.mode=m;
 $("mFull").setAttribute("aria-pressed",m==="full");
 $("mShort").setAttribute("aria-pressed",m==="short");
 $("shortBox").classList.toggle("hide",m!=="short");
 $("txtLb").textContent=m==="short"?"Dán link cần rút gọn (bắt đầu bằng https://)":"Dán link hoặc nhập văn bản";
 $("lm").textContent="";
 syncKey();draw();
}
$("mFull").onclick=function(){setMode("full")};
$("mShort").onclick=function(){setMode("short")};
["txt","c1","c2","cbg","cc","grad","ccOn","transp","ecl","size","mar","lsz"].forEach(function(id){
 $(id).addEventListener("input",function(){
  if(id==="size")$("sizev").textContent=this.value;
  if(id==="mar")$("marv").textContent=this.value;
  if(id==="lsz")$("lszv").textContent=this.value;
  if(id==="txt")syncKey();
  draw();
 });
});
$("logo").addEventListener("change",function(){
 var f=this.files&&this.files[0];if(!f)return;
 var r=new FileReader();
 r.onload=function(){S.logo=r.result;$("logoCtl").classList.remove("hide");$("ecl").value="H";draw()};
 r.readAsDataURL(f);
});
$("logoRm").onclick=function(){S.logo=null;$("logo").value="";$("logoCtl").classList.add("hide");draw()};

function save(ext){
 if(!S.qr||!qrData()){$("msg").textContent="Hãy tạo mã QR trước khi tải.";return}
 S.qr.download({name:"qr-code",extension:ext});
}
$("dlPng").onclick=function(){save("png")};
$("dlSvg").onclick=function(){save("svg")};
$("dlWebp").onclick=function(){save("webp")};

/* ===== Link rút gọn tự quản lý ===== */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function loadMine(){try{var m=JSON.parse(localStorage.getItem("qr_links")||"{}");return m&&typeof m==="object"?m:{}}catch(e){return{}}}
function saveMine(){try{localStorage.setItem("qr_links",JSON.stringify(links))}catch(e){}}
function renderList(){
 return;
 var ul=$("ls");ul.innerHTML="";
 Object.keys(links).forEach(function(k){
  var li=document.createElement("li");
  li.innerHTML='<span class="k">'+esc(k)+'</span><span class="u" title="'+esc(links[k])+'">'+esc(links[k])+'</span>';
  var b=document.createElement("button");b.className="sm";b.textContent="Dùng";
  b.onclick=function(){$("txt").value=links[k];S.key=k;setMode("short")};
  var d=document.createElement("button");d.className="sm";d.textContent="Ẩn";
  d.title="Chỉ ẩn khỏi danh sách trên máy này, link vẫn hoạt động";
  d.onclick=function(){delete links[k];if(S.key===k)S.key=null;saveMine();renderList();draw()};
  li.appendChild(b);li.appendChild(d);ul.appendChild(li);
 });
}
links=loadMine();renderList();syncKey();

$("mk").onclick=function(){
 var u=$("txt").value.trim(),k=$("lk").value.trim().toLowerCase(),m=$("lm"),btn=$("mk");
 m.textContent="";
 if(!/^https?:\/\/\S+$/i.test(u)){m.textContent="Hãy nhập link bắt đầu bằng http:// hoặc https:// ở ô phía trên.";return}
 if(k&&!/^[a-z0-9-]{3,30}$/.test(k)){m.textContent="Mã ngắn chỉ gồm chữ không dấu, số và dấu - (3–30 ký tự).";return}
 /* Đã tạo trước đó trên máy này thì dùng lại, không tạo trùng */
 var same=Object.keys(links).filter(function(x){return links[x]===u&&(!k||x===k)})[0];
 if(same){S.key=same;renderList();draw();m.textContent="Link này đã được tạo trước đó.";return}
 btn.disabled=true;m.textContent="Đang tạo link…";
 fetch(API+"/api/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:u,key:k})})
 .then(function(r){
  if(!r.ok)return r.text().then(function(t){throw new Error(t||("Lỗi "+r.status))});
  return r.json();
 }).then(function(d){
  links[d.key]=u;saveMine();S.key=d.key;
  m.textContent=(d.existed?"Link này đã có sẵn, dùng lại mã: ":"Đã tạo: ")+d.short;
  renderList();draw();
 }).catch(function(e){
  m.textContent=(e&&e.message&&e.message!=="Failed to fetch")?e.message:"Không kết nối được máy chủ rút gọn. Hãy thử lại sau.";
 }).then(function(){btn.disabled=false});
};

draw();
})();
</script>
</body>
</html>
